[package]
name = "cli"
description = "The bonk binary: GUI entry point plus headless subcommands"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bonk"
path = "src/main.rs"

[features]
default = ["cipher"]
cipher = ["app/cipher", "store/sqlcipher"]
plain = ["app/plain", "store/plain"]

[dependencies]
app = { path = "../app", default-features = false }
crux.workspace = true
store = { path = "../store", default-features = false }

clap.workspace = true
rpassword.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
