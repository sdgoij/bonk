[package]
name = "ffi"
description = "Foreign-function boundary for mobile and other non-Rust callers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "bonkc"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# Only the binding generator needs the CLI; the mobile library never links it.
cli = ["uniffi/cli"]

[dependencies]
argon2.workspace = true
crux.workspace = true
render.workspace = true
sha2.workspace = true
syntax.workspace = true
uniffi.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[lints]
workspace = true
