[package]
name = "app"
description = "egui application as a library: views, command dispatch, view models"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["cipher"]
# Production: SQLCipher page encryption.
cipher = ["application/cipher", "store/sqlcipher", "import/cipher"]
# Test-only fallback for hosts without a working OpenSSL/Perl toolchain.
# The UI shows a permanent warning and the CLI refuses to init silently.
plain = ["application/plain", "store/plain", "import/plain"]

[dependencies]
application.workspace = true
crux.workspace = true
store = { path = "../store", default-features = false }
render.workspace = true
import = { path = "../import", default-features = false }
time.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true

serde_json.workspace = true
zeroize.workspace = true

[dev-dependencies]
sha2.workspace = true
syntax.workspace = true
tempfile.workspace = true

[lints]
workspace = true
