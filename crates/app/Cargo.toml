[package]
name = "app"
description = "egui application as a library: views, command dispatch, view models"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["cipher"]
# Production: SQLCipher page encryption.
cipher = ["store/sqlcipher"]
# Test-only fallback for hosts without a working OpenSSL/Perl toolchain.
# The UI shows a permanent warning and the CLI refuses to init silently.
plain = ["store/plain"]

[dependencies]
crux.workspace = true
store = { path = "../store", default-features = false }
conformance.workspace = true
syntax.workspace = true
render.workspace = true
time.workspace = true
eframe.workspace = true
egui.workspace = true

serde_json.workspace = true
zeroize.workspace = true
# Decoding the PNG that Typst exports for the in-window preview. Already in the
# tree through eframe; this only declares the use.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
