[package]
name = "import"
description = "File sniffing, XML/PDF extraction, dedupe, reconciliation"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["cipher"]
# Production: SQLCipher page encryption (via `store`).
cipher = ["store/sqlcipher"]
# Test-only fallback for hosts without a working OpenSSL/Perl toolchain.
plain = ["store/plain"]

[dependencies]
crux.workspace = true
syntax.workspace = true
store = { path = "../store", default-features = false }
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
