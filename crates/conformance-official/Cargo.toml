[package]
name = "conformance-official"
description = "Vendored official Schematron/XSLT artefacts and the isolated native XSLT binding"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Enables the external-validator oracle. The published artefacts are XSLT 2.0,
# which has no embeddable engine; the oracle runs a Java validator instead, so it
# is a development and release tool and never part of the shipped binary.
official-validation = []

[dependencies]
crux.workspace = true

[lints]
workspace = true
