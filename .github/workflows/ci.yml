name: CI

# One pipeline, in order: the cheap gates run once, the tests gate every
# platform, then the release binaries are built and the shipped Linux binary is
# run through the official validator. A tag starting with `v` turns the last
# stage into a GitHub release.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.98.0"

jobs:
  checks:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: test (${{ matrix.os }})
    needs: [checks, deny]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Intel macOS: the arm64 runner pool runs dry for long stretches, and a
        # test stage must not wait on it. The build stage cross-compiles the
        # arm64 binary from the same runner.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2

      # No MSVC setup step. The vendored OpenSSL build gets nmake from the `cc`
      # crate's registry lookup and rustc finds link.exe itself, so the runner's
      # preinstalled Visual Studio is enough; windows-latest also ships the full
      # Strawberry Perl the OpenSSL Configure script needs. The action that used
      # to import the VS environment (`ilammy/msvc-dev-cmd`) has no Node 24
      # release and is not needed here.
      - name: Test
        run: cargo test --workspace

  mobile-rust:
    name: mobile Rust
    needs: [checks, deny]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2

      # Host tests only. The Android cross-build is `mobile-cross`, because a
      # failure there should name the native build rather than the logic.
      - name: Application and FFI tests
        run: cargo test -p application -p ffi

  # The Android side: the native libraries, the Kotlin host tests, and the two
  # APKs. The instrumented job runs the same APKs on an emulator, so this job
  # publishes them as an artifact instead of making it rebuild.
  android:
    name: android build and tests
    needs: [checks, deny, mobile-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # v4 installs `platform-tools` and nothing else by default. v3 ran
      # `sdkmanager tools`, and Google has removed the legacy `tools` package
      # from the repository, so that step failed before the NDK was installed.
      # Naming the cmdline-tools build the runner image already ships (20.0)
      # keeps the action from downloading its own copy.
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"

      - name: SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370"

      - name: NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      # `-Pnative` builds both ABIs and regenerates the UniFFI bindings, so the
      # Kotlin below compiles against the surface this commit actually exports.
      - name: Shared Kotlin host tests
        run: cd mobile && ./gradlew :shared:testAndroidHostTest -Pnative

      - name: Verify the libraries
        run: |
          set -eu
          tools="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for target in aarch64-linux-android x86_64-linux-android; do
            lib="target/$target/release/libbonkc.so"
            test -f "$lib"
            "$tools/llvm-nm" -D "$lib" | grep -q uniffi_bonkc_fn_method_archive_summary
          done
          sh tools/check-page-size.sh \
            target/aarch64-linux-android/release/libbonkc.so \
            target/x86_64-linux-android/release/libbonkc.so

      # The debug pair is what the emulator installs; the release APK is what a
      # tag publishes. `-Pnative` is not only about rebuilding: it is what puts
      # `stripNdk` in the graph, and an unstripped libbonkc.so adds six megabytes
      # to the APK.
      - name: APKs
        run: cd mobile && ./gradlew :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest :androidApp:assembleRelease -Pnative

      # A regression guard, not the §6.8 number: that budget is a per-device
      # download from Play, while this APK carries both ABIs for a manual
      # install and so is roughly twice the size. Measured against the
      # universal APK, 32 MB catches a dependency that arrives unnoticed.
      - name: Download size guard
        run: |
          set -eu
          apk=mobile/androidApp/build/outputs/apk/release/androidApp-release.apk
          size=$(stat -c %s "$apk")
          echo "universal release APK: $size bytes"
          test "$size" -lt 33554432

      - uses: actions/upload-artifact@v7
        with:
          name: instrumented-apks
          path: |
            mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk
            mobile/androidApp/build/outputs/apk/androidTest/debug/androidApp-debug-androidTest.apk
            mobile/androidApp/build/outputs/apk/release/androidApp-release.apk
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: bonk-android
          path: mobile/androidApp/build/outputs/apk/release/androidApp-release.apk
          if-no-files-found: error
          retention-days: 14

  # An emulator run is the only place the golden artefact hashes and the
  # screenshot images can be checked. The runner's KVM makes the boot a couple
  # of minutes, and the tablet profile gives the 1280 dp window the screenshots
  # were drawn for. API 33 rather than 37: the Compose test rule starts Espresso,
  # which calls InputManager.getInstance, and API 37 removed it.
  android-instrumented:
    name: android instrumented tests
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v8
        with:
          name: instrumented-apks
          path: mobile/apks

      # Without this the runner user cannot open /dev/kvm, the emulator falls
      # back to TCG, and a boot that should take a minute takes thirteen.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm is missing; the emulator will run under TCG"
          fi

      - name: Golden hashes and shell screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            # A phone profile boots far more reliably than a tablet one under the
            # runner's software renderer. The screenshots are drawn at one pixel
            # per dp in a 1280x800 box, so the display is widened to fit them
            # rather than taking a tablet's native resolution.
            adb shell wm size 1800x1200
            sleep 3
            sh tools/run-emulator-suite.sh mobile/apks

  plain:
    name: unencrypted fallback builds
    needs: [checks, deny]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Test without SQLCipher
        run: cargo test --workspace --no-default-features --features plain

  # Native builds where the runner architecture is not the scarce resource.
  build:
    name: build (${{ matrix.target }})
    needs: [test, plain]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: bonk
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: bonk
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: bonk.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Runner matches the target
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "runner is $host, matrix says ${{ matrix.target }}" >&2
            exit 1
          fi

      - name: Build
        run: cargo build --locked --release -p cli

      - name: Smoke test
        shell: bash
        run: ./target/release/${{ matrix.binary }} --version

      # The release package is the binary plus the two files a user needs to
      # decide whether they may run it.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          name="bonk-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/release/${{ matrix.binary }}" "dist/$name/"
          cp README.md LICENSE.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          ls -l dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "bonk-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" "dist/$name/"
          Copy-Item README.md, LICENSE.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v7
        with:
          name: bonk-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # Both Apple targets come from one Intel runner. The arm64 macOS pool runs dry
  # for long stretches, and a hotfix must not wait for a queue; the Intel pool is
  # available, and Rust cross-compiles between the two Apple targets with the
  # same SDK. The cross-built binary cannot be executed here, so its architecture
  # is verified with lipo instead.
  build-macos:
    name: build (macOS)
    needs: [test, plain]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-intel-cross

      - name: Runner is an Intel Mac
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "x86_64-apple-darwin" ]; then
            echo "runner is $host, expected x86_64-apple-darwin" >&2
            exit 1
          fi

      - name: Build Intel
        run: cargo build --locked --release -p cli --target x86_64-apple-darwin

      - name: Build Apple silicon
        run: cargo build --locked --release -p cli --target aarch64-apple-darwin

      - name: Smoke test the native binary
        run: ./target/x86_64-apple-darwin/release/bonk --version

      - name: Check the cross-built binary is arm64
        run: |
          archs=$(lipo -archs target/aarch64-apple-darwin/release/bonk)
          echo "aarch64-apple-darwin binary: $archs"
          if [ "$archs" != "arm64" ]; then
            echo "expected arm64, got '$archs'" >&2
            exit 1
          fi

      - name: Package
        run: |
          set -eu
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            name="bonk-$target"
            mkdir -p "dist/$name"
            cp "target/$target/release/bonk" "dist/$name/"
            cp README.md LICENSE.md "dist/$name/"
            tar -czf "dist/$name.tar.gz" -C dist "$name"
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: bonk-x86_64-apple-darwin
          path: dist/bonk-x86_64-apple-darwin.tar.gz
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: bonk-aarch64-apple-darwin
          path: dist/bonk-aarch64-apple-darwin.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The same binary that will be published, run over the EN 16931 corpus and
  # through the official validator. One platform is enough: the bytes are
  # written by platform-independent code, and Mustang is a Java process.
  conformance:
    name: conformance (Mustang EN 16931)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v6
        with:
          path: target/validator
          key: mustang-2.17.0

      - uses: actions/download-artifact@v8
        with:
          name: bonk-x86_64-unknown-linux-gnu
          path: package

      - name: Unpack the shipped binary
        run: |
          tar -xzf package/bonk-x86_64-unknown-linux-gnu.tar.gz -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/bonk-x86_64-unknown-linux-gnu/bonk"
          echo "BONK_BIN=$RUNNER_TEMP/bonk-x86_64-unknown-linux-gnu/bonk" >> "$GITHUB_ENV"

      - name: EN 16931 corpus
        run: sh tools/validate-m1.sh

      - name: Expected findings against the authority
        run: sh tools/validate-findings.sh

      - name: VAT category matrix
        run: sh tools/validate-vat-matrix.sh

  release:
    name: release
    needs: [build, build-macos, conformance, android, android-instrumented]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2

      # The SBOM describes the shipped binary's dependency graph. The timestamp
      # comes from the commit, so the same tag produces the same document.
      - name: Reproducible timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # `cargo cyclonedx` writes one file per workspace member; the CLI is the
      # one that ships, and its components are every dependency it links.
      #
      # One document per supported target. The resolver filters by platform, so
      # each lists what that archive links; a document from the host target
      # would speak for one archive and stay silent on the other four.
      - name: SBOMs
        run: |
          cargo install cargo-cyclonedx --locked --version 0.5.10
          mkdir -p dist
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        x86_64-pc-windows-msvc \
                        x86_64-apple-darwin aarch64-apple-darwin; do
            cargo cyclonedx --manifest-path crates/cli/Cargo.toml \
              --format json --spec-version 1.6 --target "$target" \
              --override-filename "bonk-$target.cdx"
            cp "crates/cli/bonk-$target.cdx.json" dist/
          done

      - uses: actions/download-artifact@v8
        with:
          # Everything a tag publishes is named bonk-*; the emulator's debug pair
          # is called instrumented-apks and stays out of the release.
          pattern: bonk-*
          path: dist
          merge-multiple: true

      # The asset name says what it is; the APK is signed with the debug key,
      # because there is no release key yet.
      - name: Name the APK
        run: |
          set -eu
          mv dist/androidApp-release.apk dist/bonk-android.apk

      # Every asset, including the SBOMs, so a download can be checked offline.
      # The counts are asserted first: a short set means an archive or a target
      # went missing and the sums would quietly describe an incomplete release.
      - name: Checksums
        run: |
          cd dist
          test "$(ls bonk-*.tar.gz bonk-*.zip | wc -l)" -eq 5
          test "$(ls bonk-*.apk | wc -l)" -eq 1
          test "$(ls bonk-*.cdx.json | wc -l)" -eq 5
          sha256sum bonk-*.tar.gz bonk-*.zip bonk-*.apk bonk-*.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: List the assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.apk
            dist/*.cdx.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
