# cargo-deny policy.
#
# Permissive licences only. AGPL/SSPL are rejected on purpose: the PDF stack
# must not be MuPDF or iText, and the network layer must stay vendorable.

[graph]
all-features = true
# Check the graphs CI actually builds. Without this, a dependency that only the
# Linux or macOS job resolves can pass on a Windows development host and fail in
# CI, which is the one failure mode this gate exists to prevent.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Unmaintained advisories fail when the crate is one this workspace depends on
# directly, which is the case where the choice is ours. The Linux desktop stacks
# — atspi for screen readers, and the Secret Service store inside keyring — pull
# in zvariant and zvariant_derive, both folded into zbus 6, and nothing in that
# stack has migrated yet. Failing on a maintenance announcement in code that
# never compiles into the Windows or macOS binaries would block every build for
# no safety. Vulnerabilities and unsound advisories are not affected: those
# still fail wherever they appear.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
# Every crate here says `publish = false`, so nothing in this workspace is
# distributed as a crate; ignoring private crates keeps that distinction visible
# rather than relying on every manifest staying perfectly licensed.
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "BSL-1.0",
    "Unlicense",
    # The fonts egui embeds for a window without a system font stack. Both are
    # free licences, and both are already inside every egui binary.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # SQLCipher's bundled SQLite sources: the SQLite blessing and, for one small
    # part, the WTFPL. Both are permissions rather than obligations.
    "blessing",
    "WTFPL",
]

[bans]
multiple-versions = "warn"
# A path dependency without a version is how the crates in this workspace refer
# to each other; they are never published, so there is no version to pin.
allow-wildcard-paths = true
wildcards = "deny"
deny = [
    # Copyleft PDF/networking stacks that would poison distribution.
    { name = "mupdf" },
    { name = "itext" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
