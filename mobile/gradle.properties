org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 rejects the Kotlin Multiplatform plugin in an application module unless
# the new DSL/built-in Kotlin path is disabled. S2 uses the compatibility mode;
# M11.1 should split the shared code into a
# `com.android.kotlin.multiplatform.library` module instead.
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
