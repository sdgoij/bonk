[workspace]
resolver = "3"
members = [
    "crates/crux",
    "crates/conformance",
    "crates/conformance-official",
    "crates/syntax",
    "crates/store",
    "crates/render",
    "crates/import",
    "crates/bridge",
    "crates/sync",
    "crates/app",
    "crates/cli",
    "crates/testkit",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
crux = { path = "crates/crux" }
conformance = { path = "crates/conformance" }
conformance-official = { path = "crates/conformance-official" }
syntax = { path = "crates/syntax" }
store = { path = "crates/store" }
render = { path = "crates/render" }
import = { path = "crates/import" }
bridge = { path = "crates/bridge" }
sync = { path = "crates/sync" }
app = { path = "crates/app" }
testkit = { path = "crates/testkit" }

uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
thiserror = "2"
proptest = "1"

rusqlite = "0.41"
argon2 = "0.6"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
keyring = "4"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"

clap = { version = "4", features = ["derive"] }
rpassword = "7"
quick-xml = "0.42"
lopdf = "0.46"

[profile.test]
# MSVC's linker refuses a program database larger than 4 GB (LNK1140), and the
# desktop test binary — eframe, wgpu, the SQLCipher binding — is large enough to
# cross it. Line tables are kept, so a panic still names its file and line;
# variable inspection in a debugger is what is traded away, and only for tests.
debug = 1

[workspace.lints.rust]
unsafe_code = "forbid"
# Vendored static libraries (OpenSSL) reference PDBs that are not shipped;
# the linker noise is not actionable and must not fail `-D warnings`.
linker_messages = "allow"

[workspace.lints.clippy]
float_arithmetic = "deny"
unwrap_used = "warn"
